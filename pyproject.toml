[project]
name = "oman_fawtara"
authors = [{ name = "thinkNXG", email = "kreataothinkcadd@gmail.com" }]
description = "Oman VAT compliance, VAT returns and Fawtara e-invoicing for thinkNXG ERP (ERPNext v16)"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
indent-style = "tab"
